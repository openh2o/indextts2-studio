name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lightweight-checks:
    name: Lightweight Python checks
    # uv.lock only resolves for win32 (tool.uv.environments in pyproject.toml),
    # so the test job must run on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral/setup-uv@v5

      - name: Run tests (no GPU)
        run: uv run --extra test pytest -m "not gpu" -v
